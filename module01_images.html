<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOD·01 // Computer History & Technology</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #03040a;
    --c: #7b2fff;
    --cr: 123,47,255;
    --star: #c8c4ff;
    --panel: #080614;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--void);
    color: var(--star);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 20%, rgba(123,47,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 90% 80%, rgba(123,47,255,0.05) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(123,47,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,47,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0; pointer-events: none;
  }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(3,4,10,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(123,47,255,0.15);
    padding: 1.2rem 2rem;
    display: flex; justify-content: space-between; align-items: center;
  }

  .logo {
    font-weight: 700; font-size: 1rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--star); text-decoration: none;
    display: flex; align-items: center; gap: 0.75rem;
  }

  .logo-gem {
    width: 10px; height: 10px;
    background: #7b2fff;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 10px #7b2fff;
  }

  .header-right {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem; letter-spacing: 0.25em;
    text-transform: uppercase; color: rgba(200,196,255,0.25);
  }

  .mod-hero {
    position: relative; z-index: 1;
    padding: 3rem 2rem 2.5rem;
    border-bottom: 1px solid rgba(123,47,255,0.1);
    display: flex; align-items: flex-end;
    justify-content: space-between; gap: 2rem;
  }

  .mod-eyebrow {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: #7b2fff;
    opacity: 0.7; margin-bottom: 0.75rem;
  }

  .mod-title {
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 4rem);
    letter-spacing: 0.08em; text-transform: uppercase;
    line-height: 0.9; color: #7b2fff;
  }

  .mod-right {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(200,196,255,0.2);
    text-align: right; line-height: 2; white-space: nowrap;
  }

  .mod-count-big {
    font-weight: 700; font-size: 5rem; line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1px rgba(123,47,255,0.2);
    letter-spacing: -0.05em; display: block;
  }

  .nav-row {
    position: relative; z-index: 1;
    padding: 1rem 2rem 0.5rem;
    display: flex; gap: 1rem;
    border-bottom: 1px solid rgba(123,47,255,0.08);
  }

  .nav-btn {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--star);
    background: transparent;
    border: 1px solid rgba(123,47,255,0.3);
    padding: 0.45rem 1.1rem;
    text-decoration: none; transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .nav-btn:hover {
    background: rgba(123,47,255,0.15);
    border-color: #7b2fff; color: #fff;
  }

  .main { position: relative; z-index: 1; padding: 2rem; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 1px;
    background: rgba(123,47,255,0.08);
    border: 1px solid rgba(123,47,255,0.08);
  }

  .proj-card {
    background: var(--panel);
    cursor: pointer; position: relative; overflow: hidden;
    transition: background 0.2s;
    border: 1px solid rgba(123,47,255,0.08);
  }

  .proj-card::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, #7b2fff, transparent);
    opacity: 0.5;
  }

  .proj-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top right, rgba(123,47,255,0.07) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.3s; z-index: 1;
  }

  .proj-card:hover { background: #0d0b1e; border-color: rgba(123,47,255,0.35); }
  .proj-card:hover::before { opacity: 1; }
  .proj-card:hover .card-img { transform: scale(1.04); filter: brightness(0.9) saturate(1.1); }

  .card-img {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    filter: brightness(0.7) saturate(0.75); transition: filter 0.3s, transform 0.4s;
  }

  .card-label {
    padding: 0.6rem 0.7rem;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(123,47,255,0.1);
    position: relative; z-index: 2;
  }

  .card-tag {
    font-family: 'Courier Prime', monospace;
    font-size: 0.5rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: #7b2fff; opacity: 0.8;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .card-tag::before {
    content: '';
    width: 4px; height: 4px; background: #7b2fff;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 5px #7b2fff;
  }

  .card-open {
    font-family: 'Courier Prime', monospace;
    font-size: 0.5rem; letter-spacing: 0.15em;
    color: rgba(200,196,255,0.25); text-transform: uppercase; transition: color 0.2s;
  }
  .proj-card:hover .card-open { color: #7b2fff; }

  .modal {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(3,4,10,0.92);
    align-items: flex-start; justify-content: center;
    padding: 1rem; overflow-y: auto; backdrop-filter: blur(8px);
  }
  .modal.open { display: flex; }

  .modal-box {
    background: var(--panel);
    border: 1px solid rgba(123,47,255,0.2);
    width: 100%; max-width: 860px;
    position: relative; margin: auto;
    box-shadow: 0 0 60px rgba(123,47,255,0.1);
  }

  .modal-top-bar { height: 1px; background: linear-gradient(90deg, #7b2fff, transparent); }

  .modal-header {
    padding: 1rem 1.25rem 0.85rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(123,47,255,0.1);
  }

  .modal-mod-id {
    font-family: 'Courier Prime', monospace;
    font-size: 0.52rem; font-weight: 700; letter-spacing: 0.25em;
    color: #7b2fff;
    background: rgba(123,47,255,0.1);
    border: 1px solid rgba(123,47,255,0.25);
    padding: 0.2rem 0.55rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .modal-mod-id::before {
    content: '';
    width: 5px; height: 5px; background: #7b2fff;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 6px #7b2fff;
  }

  .modal-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em;
    color: var(--star); text-transform: uppercase; flex: 1; margin: 0 0.75rem;
  }

  .modal-close {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem; letter-spacing: 0.2em;
    color: rgba(200,196,255,0.35); background: transparent;
    border: 1px solid rgba(200,196,255,0.12);
    padding: 0.3rem 0.7rem; cursor: pointer;
    text-transform: uppercase; transition: all 0.2s;
  }
  .modal-close:hover { color: #fff; border-color: rgba(200,196,255,0.4); }

  .modal-img {
    width: 100%; height: auto; display: block;
    object-fit: contain; background: #000;
    border-bottom: 1px solid rgba(123,47,255,0.1);
  }

  .modal-body { padding: 1.25rem; }

  .modal-body p {
    font-family: 'EB Garamond', serif;
    font-size: 0.92rem; line-height: 1.85;
    color: rgba(200,196,255,0.65); margin-bottom: 1rem;
  }
  .modal-body p:last-of-type { margin-bottom: 0; }

  .modal-footnotes {
    margin-top: 1rem; padding-top: 0.75rem;
    border-top: 1px solid rgba(123,47,255,0.12);
  }
  .footnote-label {
    font-family: 'Courier Prime', monospace;
    font-size: 0.5rem; letter-spacing: 0.25em;
    color: rgba(200,196,255,0.2); text-transform: uppercase; margin-bottom: 0.4rem;
  }
  .modal-footnotes a {
    display: block; font-family: 'Courier Prime', monospace;
    font-size: 0.58rem; letter-spacing: 0.08em;
    color: #7b2fff; text-decoration: none; margin-bottom: 0.3rem;
    opacity: 0.6; transition: opacity 0.2s;
  }
  .modal-footnotes a:hover { opacity: 1; }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 2rem;
    border-top: 1px solid rgba(123,47,255,0.1);
    font-family: 'Courier Prime', monospace;
    font-size: 0.52rem; letter-spacing: 0.25em;
    text-transform: uppercase; color: rgba(200,196,255,0.15);
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="logo-gem"></div>
    Speculation Capsule
  </a>
  <div class="header-right">ART104 · Spring 2026 · MOD·01</div>
</header>

<div class="mod-hero">
  <div>
    <div class="mod-eyebrow">◈ module 01 · machines · memory · infrastructure</div>
    <h1 class="mod-title">Computer<br>History &amp; Tech</h1>
  </div>
  <div class="mod-right">
    <span class="mod-count-big">22</span>
    22 artifacts<br>Spring 2026
  </div>
</div>

<div class="nav-row">
  <a href="index.html" class="nav-btn">← Index</a>
  <a href="module02_images.html" class="nav-btn">Module 02 →</a>
</div>

<main class="main">
  <div class="project-grid" id="grid"></div>
</main>

<footer>ART104 · Spring 2026 · MOD·01 · 22 Artifacts · Speculation Capsule</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-top-bar"></div>
    <div class="modal-header">
      <span class="modal-mod-id" id="modal-mod-label">MOD·01</span>
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">✕ Close</button>

    <img class="modal-img" id="modal-image" src="" alt="">
    <div class="modal-body">
      <div id="modal-text"></div>
    </div>
  </div>
</div>

<script>
const moduleData = {
  "1":  { img:"images/computer1.png",  p1:{text:"Computer1 paragraph 1 text...",footnote:"https://example.com/computer1p1"},  p2:{text:"Computer1 paragraph 2 text...",footnote:"https://example.com/computer1p2"} },
  "2":  { img:"images/computer2.png",  p1:{text:"Computer2 paragraph 1 text...",footnote:"https://example.com/computer2p1"},  p2:{text:"Computer2 paragraph 2 text...",footnote:"https://example.com/computer2p2"} },
  "3":  { img:"images/computer3.png",  p1:{text:"Computer3 paragraph 1 text...",footnote:"https://example.com/computer3p1"},  p2:{text:"Computer3 paragraph 2 text...",footnote:"https://example.com/computer3p2"} },
  "4":  { img:"images/computer4.png",  p1:{text:"Computer4 paragraph 1 text...",footnote:"https://example.com/computer4p1"},  p2:{text:"Computer4 paragraph 2 text...",footnote:"https://example.com/computer4p2"} },
  "5":  { img:"images/computer5.png",  p1:{text:"Computer5 paragraph 1 text...",footnote:"https://example.com/computer5p1"},  p2:{text:"Computer5 paragraph 2 text...",footnote:"https://example.com/computer5p2"} },
  "6":  { img:"images/computer6.png",  p1:{text:"Computer6 paragraph 1 text...",footnote:"https://example.com/computer6p1"},  p2:{text:"Computer6 paragraph 2 text...",footnote:"https://example.com/computer6p2"} },
  "7":  { img:"images/computer7.png",  p1:{text:"Computer7 paragraph 1 text...",footnote:"https://example.com/computer7p1"},  p2:{text:"Computer7 paragraph 2 text...",footnote:"https://example.com/computer7p2"} },
  "8":  { img:"images/computer8.png",  p1:{text:"Computer8 paragraph 1 text...",footnote:"https://example.com/computer8p1"},  p2:{text:"Computer8 paragraph 2 text...",footnote:"https://example.com/computer8p2"} },
  "9":  { img:"images/computer9.png",  p1:{text:"Computer9 paragraph 1 text...",footnote:"https://example.com/computer9p1"},  p2:{text:"Computer9 paragraph 2 text...",footnote:"https://example.com/computer9p2"} },
  "10": { img:"images/computer10.png", p1:{text:"Computer10 paragraph 1 text...",footnote:"https://example.com/computer10p1"}, p2:{text:"Computer10 paragraph 2 text...",footnote:"https://example.com/computer10p2"} },
  "11": { img:"images/computer11.png", p1:{text:"Computer11 paragraph 1 text...",footnote:"https://example.com/computer11p1"}, p2:{text:"Computer11 paragraph 2 text...",footnote:"https://example.com/computer11p2"} },
  "12": { img:"images/computer12.png", p1:{text:"Computer12 paragraph 1 text...",footnote:"https://example.com/computer12p1"}, p2:{text:"Computer12 paragraph 2 text...",footnote:"https://example.com/computer12p2"} },
  "13": { img:"images/computer13.png", p1:{text:"Computer13 paragraph 1 text...",footnote:"https://example.com/computer13p1"}, p2:{text:"Computer13 paragraph 2 text...",footnote:"https://example.com/computer13p2"} },
  "14": { img:"images/computer14.png", p1:{text:"Computer14 paragraph 1 text...",footnote:"https://example.com/computer14p1"}, p2:{text:"Computer14 paragraph 2 text...",footnote:"https://example.com/computer14p2"} },
  "15": { img:"images/computer15.png", p1:{text:"Computer15 paragraph 1 text...",footnote:"https://example.com/computer15p1"}, p2:{text:"Computer15 paragraph 2 text...",footnote:"https://example.com/computer15p2"} },
  "16": { img:"images/computer16.png", p1:{text:"Computer16 paragraph 1 text...",footnote:"https://example.com/computer16p1"}, p2:{text:"Computer16 paragraph 2 text...",footnote:"https://example.com/computer16p2"} },
  "17": { img:"images/computer17.png", p1:{text:"Computer17 paragraph 1 text...",footnote:"https://example.com/computer17p1"}, p2:{text:"Computer17 paragraph 2 text...",footnote:"https://example.com/computer17p2"} },
  "18": { img:"images/computer18.png", p1:{text:"Computer18 paragraph 1 text...",footnote:"https://example.com/computer18p1"}, p2:{text:"Computer18 paragraph 2 text...",footnote:"https://example.com/computer18p2"} },
  "19": { img:"images/computer19.png", p1:{text:"What I find most interesting and inspiring about this work is its emphasis on AR/XR technology and how devices like the Apple Vision Pro signal a shift toward immersive environments and how humans interact with computers. It raises important questions for me about the psychological effects of prolonged use and whether such technologies could push society toward a dystopia of escapism, in which virtual experiences replace meaningful engagement with reality. I appreciate the simplicity and practical design of the Apple Vision, but I\u2019m uneasy about how strongly Apple encourages adoption, framing it as a necessary next step rather than an optional tool. This closely connects to my lived experience, as companies constantly try to sell the next \u201cfad,\u201d often positioning it as transformative or essential. Personally, I\u2019m more inclined to value and engage with what reality already offers than to consume carefully constructed false realities. While I understand that humanity naturally craves new experiences and technological exploration, I worry that for some people, these immersive systems may become substitutes for reality, reinforcing patterns of escapism rather than enriching everyday life.",footnote:"https://example.com/computer19p1"}, p2:{text:"Computer19 paragraph 2 text...",footnote:"https://example.com/computer19p2"} },
  "20": { img:"images/computer20.png", p1:{text:"Computer20 paragraph 1 text...",footnote:"https://example.com/computer20p1"}, p2:{text:"Computer20 paragraph 2 text...",footnote:"https://example.com/computer20p2"} },
  "21": { img:"images/computer21.png", p1:{text:"Computer21 paragraph 1 text...",footnote:"taivideo.html"},                    p2:{text:"Computer21 paragraph 2 text...",footnote:"https://example.com/computer21p2"} },
  "22": { img:"images/computer22.png", p1:{text:"Computer22 paragraph 1 text...",footnote:"https://example.com/computer22p1"}, p2:{text:"Computer22 paragraph 2 text...",footnote:"https://example.com/computer22p2"} }
};

function buildGrid(data, modId) {
  const grid = document.getElementById('grid');
  Object.keys(data).forEach(id => {
    const d = data[id];
    const card = document.createElement('div');
    card.className = 'proj-card';
    card.innerHTML = `
      <img class="card-img" src="${d.img}" alt="artifact ${id}">
      <div class="card-label">
        <span class="card-tag">ART·${String(id).padStart(2,'0')}</span>
        <span class="card-open">Open →</span>
      </div>`;
    card.addEventListener('click', () => openModal(id, data, modId));
    grid.appendChild(card);
  });
}

function openModal(id, data, modId) {
  const d = data[id];
  document.getElementById('modal-mod-label').textContent = modId + ' / ART·' + String(id).padStart(2,'0');
  document.getElementById('modal-title').textContent = 'Artifact ' + String(id).padStart(2,'0');
  document.getElementById('modal-image').src = d.img;
  document.getElementById('modal-text').innerHTML = `
    <p>${d.p1.text}</p>
    <p>${d.p2.text}</p>
    <div class="modal-footnotes">
      <div class="footnote-label">◈ References</div>
      <a href="${d.p1.footnote}" target="_blank" rel="noopener">↗ Source 01 — ${d.p1.footnote}</a>
      <a href="${d.p2.footnote}" target="_blank" rel="noopener">↗ Source 02 — ${d.p2.footnote}</a>
    </div>`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

buildGrid(moduleData, 'MOD·01');
</script>
</body>
</html>
