<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPECULATION CAPSULE // ART104</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Courier+Prime&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #03040a; overflow: hidden; height: 100vh; width: 100vw; font-family: 'Rajdhani', sans-serif; color: #c8c4ff; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* centred UI layer */
  .stage {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    gap: 0;
  }

  .eyebrow {
    font-family: 'Courier Prime', monospace;
    font-size: .55rem; letter-spacing: .38em; text-transform: uppercase;
    color: #00ffb3; opacity: 0;
    animation: fadein 1.2s ease forwards .4s;
    margin-bottom: 1.4rem;
  }

  /* orb placeholder — three.js renders behind this, text sits on top */
  .orb-gap { height: 260px; } /* leave room for the 3D orb */

  .title {
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 5rem);
    letter-spacing: .18em; text-transform: uppercase; line-height: .9;
    text-align: center;
    opacity: 0; animation: fadein 1.2s ease forwards .7s;
    margin-top: 1.6rem;
  }
  .title .glow { color: #7b2fff; text-shadow: 0 0 28px rgba(123,47,255,.7); }
  .title .acc  { color: #ff2d78; }

  .sub {
    font-family: 'Courier Prime', monospace;
    font-size: .55rem; letter-spacing: .28em; text-transform: uppercase;
    color: rgba(200,196,255,.35);
    margin-top: 1rem;
    opacity: 0; animation: fadein 1s ease forwards 1s;
  }

  /* signal divider */
  .sig {
    display: flex; align-items: center; gap: .8rem;
    width: min(420px, 78vw); margin: 1.8rem 0;
    opacity: 0; animation: fadein 1s ease forwards 1.2s;
  }
  .sig::before, .sig::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(123,47,255,.5), transparent);
  }
  .sig-node {
    font-family: 'Courier Prime', monospace; font-size: .46rem;
    letter-spacing: .28em; color: rgba(123,47,255,.55); white-space: nowrap;
    animation: blink 2.4s ease-in-out infinite;
  }

  /* enter button */
  .enter-btn {
    pointer-events: all;
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: .8rem; letter-spacing: .45em; text-transform: uppercase;
    color: #c8c4ff; background: transparent;
    border: 1px solid rgba(123,47,255,.5);
    padding: .9rem 3rem; text-decoration: none;
    transition: all .25s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    opacity: 0; animation: fadein 1s ease forwards 1.5s;
    display: inline-block;
  }
  .enter-btn:hover { border-color: #7b2fff; color: #fff; background: rgba(123,47,255,.12); box-shadow: 0 0 30px rgba(123,47,255,.22); }

  /* corner brackets */
  .corner { position: fixed; pointer-events: none; opacity: .25; z-index: 10; }
  .tl{top:16px;left:16px} .tr{top:16px;right:16px} .bl{bottom:16px;left:16px} .br{bottom:16px;right:16px}

  /* sys labels */
  .sys-tl { position:fixed; top:18px; left:46px; font-family:'Courier Prime',monospace; font-size:.46rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(123,47,255,.3); z-index:10; pointer-events:none; }
  .sys-br { position:fixed; bottom:18px; right:46px; font-family:'Courier Prime',monospace; font-size:.44rem; letter-spacing:.18em; text-transform:uppercase; color:rgba(200,196,255,.12); text-align:right; line-height:1.9; z-index:10; pointer-events:none; }

  @keyframes fadein { to { opacity: 1; } }
  @keyframes blink  { 0%,100%{opacity:.65} 50%{opacity:.1} }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- corner brackets -->
<div class="corner tl"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M0 22L0 0L22 0" stroke="rgba(123,47,255,.8)" fill="none" stroke-width="1"/></svg></div>
<div class="corner tr"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M22 22L22 0L0 0" stroke="rgba(123,47,255,.8)" fill="none" stroke-width="1"/></svg></div>
<div class="corner bl"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M0 0L0 22L22 22" stroke="rgba(123,47,255,.8)" fill="none" stroke-width="1"/></svg></div>
<div class="corner br"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M22 0L22 22L0 22" stroke="rgba(123,47,255,.8)" fill="none" stroke-width="1"/></svg></div>

<div class="sys-tl">// ART104 · S2026 · node online</div>
<div class="sys-br">37.9749°N · 122.0297°W<br>56 artifacts</div>

<div class="stage">
  <p class="eyebrow">// ART104 · Spring 2026</p>

  <div class="orb-gap"></div>

  <h1 class="title">
    <span class="glow">SPECU</span><span class="acc">LA</span>TION<br>CAPSULE
  </h1>

  <p class="sub">56 speculative artifacts</p>

  <div class="sig"><span class="sig-node">◈ sealed payload · awaiting entry ◈</span></div>

  <a href="index.html" class="enter-btn">Open Capsule</a>
</div>

<script>
const C = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: C, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x03040a);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 100);
camera.position.set(0, 0, 7);
camera.lookAt(0, 0, 0);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// Lights
scene.add(new THREE.AmbientLight(0x1a0a3a, 2.5));
const key = new THREE.DirectionalLight(0xc8b0ff, 1); key.position.set(5, 10, 8); scene.add(key);
const rimL = new THREE.DirectionalLight(0x7b2fff, 0.6); rimL.position.set(-8, 2, -5); scene.add(rimL);

// Stars
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(400 * 3);
for (let i = 0; i < sPos.length; i++) sPos[i] = (Math.random() - .5) * (i % 3 === 1 ? 30 : 60);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xc8c4ff, size: 0.1, transparent: true, opacity: .75 }));
scene.add(stars);

// ── ORB ──────────────────────────────────────────────────
const orb = new THREE.Group();
// position centred in upper portion of screen
orb.position.set(0, 0.8, 0);
scene.add(orb);

// White core
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.28, 32, 32),
  new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 })
);
orb.add(core);

// Shells
[
  [0.48, 0xaa66ff, 0.88, true],
  [0.72, 0x7b2fff, 0.42, true],
  [1.0,  0x6622ee, 0.24, true],
  [1.38, 0x5511cc, 0.13, true],
  [2.0,  0x7b2fff, 0.055,true],
  [3.0,  0x4400aa, 0.02, true],
].forEach(([r, col, op, back]) => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r, 32, 32),
    new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: op, side: THREE.BackSide })
  );
  orb.add(m);
});

// Canvas glow billboard — inner tight bloom
function makeGlowSprite(size, stops) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(128,128,0, 128,128,128);
  stops.forEach(([pos, col]) => g.addColorStop(pos, col));
  cx.fillStyle = g; cx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(cv);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 1, depthWrite: false, side: THREE.DoubleSide })
  );
  mesh.userData.isBillboard = true;
  return mesh;
}

orb.add(makeGlowSprite(7, [
  [0,    'rgba(220,170,255,0.95)'],
  [0.1,  'rgba(160,70,255,0.82)'],
  [0.3,  'rgba(110,25,230,0.45)'],
  [0.6,  'rgba(75,0,190,0.14)'],
  [1,    'rgba(50,0,150,0)'],
]));

orb.add(makeGlowSprite(16, [
  [0,    'rgba(160,80,255,0.55)'],
  [0.2,  'rgba(100,20,255,0.22)'],
  [0.55, 'rgba(60,0,180,0.07)'],
  [1,    'rgba(40,0,120,0)'],
]));

orb.add(makeGlowSprite(30, [
  [0,    'rgba(110,40,200,0.22)'],
  [0.3,  'rgba(70,0,160,0.07)'],
  [0.7,  'rgba(50,0,120,0.02)'],
  [1,    'rgba(30,0,80,0)'],
]));

// Spinning rings
[
  [1.6,  0.38,  0.85, 0x9944ff, 0.72],
  [2.05, 1.12, -0.55, 0xff2d78, 0.48],
  [2.5,  0.76,  0.38, 0x00ffb3, 0.32],
  [1.88, 1.62, -0.28, 0xc8c4ff, 0.22],
].forEach(([r, tilt, speed, col, op]) => {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.03, 8, 64),
    new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: op })
  );
  ring.rotation.x = tilt;
  ring.userData.speed = speed;
  orb.add(ring);
});

// Orbiting dots
for (let i = 0; i < 8; i++) {
  const dot = new THREE.Mesh(
    new THREE.BoxGeometry(0.11, 0.11, 0.11),
    new THREE.MeshLambertMaterial({ color: i%2===0 ? 0xc8c4ff : 0xaa66ff, transparent: true, opacity: .85 })
  );
  dot.rotation.z = Math.PI / 4;
  dot.userData.orbAngle = (i/8) * Math.PI * 2;
  dot.userData.orbR     = 1.5 + Math.random() * .8;
  dot.userData.orbSpeed = 0.38 + Math.random() * .42;
  dot.userData.orbTilt  = (Math.random() - .5) * 1.8;
  orb.add(dot);
}

// Point lights
const pLight  = new THREE.PointLight(0x9944ff, 3.8, 20); scene.add(pLight);
const pLight2 = new THREE.PointLight(0xff2d78, 1.2, 12); scene.add(pLight2);

// ── ANIMATE ──────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += .016;

  // Orb shell breathe
  orb.children.forEach((c, i) => {
    if (c.geometry && c.geometry.type === 'SphereGeometry' && c !== core) {
      const base = c.material.opacity;
      c.material.opacity = base + Math.sin(t * (0.8 + i * .2)) * .015;
    }
    if (c.userData.isBillboard) c.lookAt(camera.position);
    if (c.userData.speed !== undefined) c.rotation.y += c.userData.speed * .016;
    if (c.userData.orbAngle !== undefined) {
      c.userData.orbAngle += c.userData.orbSpeed * .016;
      const a = c.userData.orbAngle, r = c.userData.orbR;
      c.position.set(
        Math.cos(a) * r,
        Math.sin(a * .7 + c.userData.orbTilt) * r * .35,
        Math.sin(a) * r
      );
      c.rotation.y += .05;
    }
  });

  // Orb gentle drift
  orb.position.x = Math.sin(t * .22) * .35;
  orb.position.y = .8 + Math.cos(t * .18) * .18;

  pLight.position.copy(orb.position);
  pLight.intensity  = 3.4 + Math.sin(t * 1.4) * .85;
  pLight2.position.set(orb.position.x, orb.position.y - .3, orb.position.z);
  pLight2.intensity = 1.0 + Math.sin(t * 1.1 + 1.2) * .4;

  stars.rotation.y += .00008;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
